<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy — Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=12">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Create your account</h1>
                <p>Start your personal AI workspace in seconds</p>
            </div>

            <div id="register-error" class="error-badge" style="display:none;"></div>

            <form action="/register" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="min. 3 characters" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="display_name">Display name</label>
                    <input type="text" id="display_name" name="display_name" required placeholder="How we'll greet you">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Min. 6 characters" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">Create account</button>
            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="/login" class="auth-link">Log in</a>
            </div>
        </div>
    </div>
    <script>
        const errors = {
            exists: 'That username is already taken.',
            short: 'Username must be at least 3 characters.',
            password: 'Password must be at least 6 characters.'
        };
        const err = new URLSearchParams(window.location.search).get('error');
        if (err && errors[err]) {
            const el = document.getElementById('register-error');
            el.textContent = errors[err];
            el.style.display = 'block';
        }
    </script>
</body>
</html>

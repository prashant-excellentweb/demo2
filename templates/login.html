<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css?v=12">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Sign in to continue chatting with Buddy</p>
            </div>

            <div id="login-error" class="error-badge" style="display:none;">Invalid username or password</div>

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="your_username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">Log in</button>
            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="/register" class="auth-link">Create one</a>
            </div>
        </div>
    </div>
    <script>
        if (new URLSearchParams(window.location.search).has('error')) {
            document.getElementById('login-error').style.display = 'block';
        }
    </script>
</body>
</html>
